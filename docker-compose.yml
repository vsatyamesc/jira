version: '3.8'

services:
  chronojira:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronojira-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/chronojira.db
    volumes:
      # Persists SQLite database to local ./data folder
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/sprints"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
